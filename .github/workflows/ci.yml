name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Instalar
        run: uv sync --locked
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src
      - name: Pytest
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - name: Construir imagen
        run: docker build -t docuchat:ci .
      - name: Arrancar y comprobar /api/health
        run: |
          docker run -d --name docuchat -p 127.0.0.1:8001:8001 docuchat:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/api/health; then exit 0; fi
            sleep 1
          done
          docker logs docuchat
          exit 1